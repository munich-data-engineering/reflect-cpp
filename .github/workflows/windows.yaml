name: windows

on: [ push, pull_request ]

jobs:
  windows-msvc:
    strategy:
      fail-fast: false
      matrix:
        format: ["JSON", "AVRO", "BOOST_SERIALIZATION", "CAPNPROTO", "CBOR", "CEREAL", "FLEXBUFFERS", "MSGPACK", "PARQUET", "TOML", "UBJSON", "XML", "YAML", "benchmarks"]
    name: "windows-msvc (${{ matrix.format }})"
    concurrency:
      group: "windows-${{ github.ref }}-${{ github.job }}-${{ matrix.format }}"
      cancel-in-progress: true
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ github.job }}-${{ matrix.format }}
      - name: Compile benchmarks
        if: matrix.format == 'benchmarks'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} -DCMAKE_CXX_STANDARD=20 -DREFLECTCPP_BUILD_BENCHMARKS=ON -DREFLECTCPP_ALL_FORMATS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Check headers
        if: matrix.format == 'headers'
        run: |
          cmake -S . -B build -DCMAKE_CXX_STANDARD=20 -DREFLECTCPP_CHECK_HEADERS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Compile tests (JSON)
        if: matrix.format == 'JSON'
        run: |
          cmake -S . -B build -DCMAKE_CXX_STANDARD=20 -DREFLECTCPP_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Compile tests (Other formats)
        if: matrix.format != 'JSON' && matrix.format != 'benchmarks' && matrix.format != 'headers'
        run: |
          cmake -S . -B build -DCMAKE_CXX_STANDARD=20 -DREFLECTCPP_BUILD_TESTS=ON -DREFLECTCPP_JSON=OFF -DREFLECTCPP_${{ matrix.format }}=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Run tests
        if: matrix.format != 'benchmarks'
        run: |
          ctest --test-dir build -C Release --output-on-failure
      - name: Run benchmarks
        if: matrix.format == 'benchmarks'
        run: |
          echo '# Benchmarks' >> $GITHUB_STEP_SUMMARY
          echo '## Benchmarks across different formats' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=canada_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=parser_inlining >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=canada_write >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=field_dispatch >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=licenses_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=licenses_write >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=person_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=person_write >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=vectors_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=points_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/all/reflect-cpp-all-format-benchmarks --benchmark_filter=bulk_numeric_vectors >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '## Benchmarks for JSON' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/json/reflect-cpp-json-benchmarks --benchmark_filter=person_read >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/json/reflect-cpp-json-benchmarks --benchmark_filter=canada >> $GITHUB_STEP_SUMMARY
          ./build/benchmarks/json/reflect-cpp-json-benchmarks --benchmark_filter=licenses >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
  windows-msvc-shared:
    strategy:
      fail-fast: false
      matrix:
        format: ["JSON", "BOOST_SERIALIZATION", "CAPNPROTO", "CBOR", "FLEXBUFFERS", "MSGPACK", "PARQUET", "TOML", "UBJSON", "XML", "YAML"]
    name: "windows-msvc-shared (${{ matrix.format }})"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: ${{ github.job }}-${{ matrix.format }}
      - name: Compile tests (JSON)
        if: matrix.format == 'JSON'
        run: |
          cmake -S . -B build -DREFLECTCPP_BUILD_SHARED=ON -DCMAKE_CXX_STANDARD=20 -DREFLECTCPP_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Compile tests (Other formats)
        if: matrix.format != 'JSON'
        run: |
          cmake -S . -B build -DREFLECTCPP_BUILD_SHARED=ON -DCMAKE_CXX_STANDARD=20 -DREFLECTCPP_BUILD_TESTS=ON -DREFLECTCPP_JSON=OFF -DREFLECTCPP_${{ matrix.format }}=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Run tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

  windows-msvc-modules:
    name: "windows-msvc modules"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/run-vcpkg@v11
      - name: Compile modules
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_STANDARD=23 \
            -DREFLECTCPP_BUILD_MODULES=ON \
            -DREFLECTCPP_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4

